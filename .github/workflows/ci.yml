name: Verify

on:
  push:
  pull_request:

jobs:
  unit-and-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run db:migrate
      - run: npm run build
      - name: Smoke test authenticated API
        env:
          BETTER_AUTH_SECRET: ci-only-secret-at-least-thirty-two-characters
        run: |
          npm run start &
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://localhost:3000/ >/dev/null; then break; fi
            sleep 2
          done
          npm run smoke:auth
